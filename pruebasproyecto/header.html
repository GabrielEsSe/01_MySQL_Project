<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro Ecológico Para Personas de la Tercera Edad Sede Aragón</title>
  <style>
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border-bottom: 4px solid #bdd6da;
      padding: 10px 24px;
      height: 150px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2.5px solid #2d3a8c;
      background: #ffffff;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 600;
      color: #707dd1;
      font-family: 'Trebuchet MS';
      letter-spacing: 0.01em;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img class="logo-circle" src="Imagen1.png" alt="Logo" />
      <span class="brand-name">Centro Ecológico Para Personas de la Tercera Edad Sede Aragón</span>
    </div>
  </header>

</body>
</html>
