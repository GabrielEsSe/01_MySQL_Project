<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro Ecológico Sede Aragón</title>
<style>
  :root {
    --verde: #2e7d52;
    --verde-claro: #4caf7d;
    --azul-acento: #1a3a5c;
    --azul-medio: #2c5f8a;
    --azul-suave: #e8f0f7;
    --gris-fondo: #f0f4f8;
    --gris-panel: #dde4ed;
    --gris-borde: #b0bec5;
    --blanco: #ffffff;
    --texto-oscuro: #1c2b3a;
    --texto-medio: #4a5568;
    --texto-claro: #718096;
    --rojo: #c0392b;
    --amarillo: #f39c12;
    --sombra: 0 4px 24px rgba(30,60,90,0.13);
    --sombra-btn: 0 2px 8px rgba(30,60,90,0.18);
    --radio: 10px;
    --radio-btn: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    color: var(--texto-oscuro);
  }

  /* ===== PANTALLAS ===== */
  .pantalla {
    display: none;
    min-height: 100vh;
    padding: 0;
    animation: fadeIn 0.3s ease;
  }
  .pantalla.activa { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== LOGIN ===== */
  #login {
    display: none;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #login.activa { display: flex; }

  .login-card {
    background: #e8edf4;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    width: 360px;
    overflow: hidden;
  }
  .login-header {
    background: #c5cdd8;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--azul-acento);
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #b0bec5;
  }
  .login-header .java-icon { font-size: 20px; }
  .login-body {
    padding: 30px 32px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .login-bulb {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle at 40% 35%, #ffe082, #f39c12 60%, #b8860b 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    box-shadow: 0 0 24px rgba(243,156,18,0.45), inset 0 0 18px rgba(255,255,255,0.2);
  }
  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--texto-oscuro);
    letter-spacing: 0.5px;
  }
  .login-field {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .login-field label {
    font-size: 11px;
    font-weight: 700;
    color: var(--texto-medio);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .login-field input {
    border: none;
    border-bottom: 2px solid var(--gris-borde);
    background: transparent;
    padding: 6px 2px;
    font-size: 14px;
    font-family: 'Nunito', sans-serif;
    color: var(--texto-oscuro);
    outline: none;
    transition: border-color 0.2s;
  }
  .login-field input:focus { border-bottom-color: var(--azul-medio); }
  .btn-login {
    background: #2222ee;
    color: #fff;
    border: none;
    border-radius: var(--radio-btn);
    padding: 10px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    box-shadow: var(--sombra-btn);
    transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }
  .btn-login:hover { background: #1a1acc; transform: translateY(-1px); }

  /* ===== TOPBAR ===== */
  .topbar {
    background: var(--azul-acento);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 0 0 0;
    border-bottom: 3px solid var(--verde);
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }
  .topbar-brand {
    background: var(--verde);
    padding: 10px 18px;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    text-align: center;
    min-width: 180px;
    letter-spacing: 0.3px;
  }
  .topbar-nav {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0;
    flex: 1;
  }
  .nav-btn {
    background: transparent;
    border: none;
    color: #cbd5e0;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 14px 16px;
    cursor: pointer;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .nav-btn:hover, .nav-btn.activo {
    color: #fff;
    background: rgba(255,255,255,0.08);
    border-bottom-color: var(--verde-claro);
  }
  .nav-logout {
    margin-left: auto;
    background: rgba(192,57,43,0.7);
    padding: 8px 16px;
    font-size: 11px;
    font-weight: 700;
    border: none;
    color: #fff;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    transition: background 0.2s;
  }
  .nav-logout:hover { background: var(--rojo); }

  /* ===== MAIN CONTENT ===== */
  .contenido {
    padding: 32px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }
  /* ===== ICON GRID (ventana principal) ===== */
  .icon-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: flex-start;
    padding: 10px 0;
  }
  .icon-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .icon-item:hover { transform: translateY(-4px); }
  .icon-box {
    width: 58px; height: 58px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .icon-label {
    font-size: 11px; font-weight: 700; color: var(--texto-medio);
    text-align: center; max-width: 70px; line-height: 1.3;
  }

  /* ===== VENTANA ICON (centrada) ===== */
  .ventana-icon-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 0 auto 18px;
  }
  .ventana-icon-center .big-icon { font-size: 52px; }
  .ventana-mod-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px; font-weight: 700;
    color: var(--texto-oscuro);
    text-align: center;
    margin-bottom: 10px;
  }
  /* ===== NOTIFICACION ===== */
  .notif {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--verde);
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: var(--sombra);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s;
    z-index: 9999;
    pointer-events: none;
  }
  .notif.show { opacity: 1; transform: translateY(0); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 700px) {
    .contenido { padding: 16px; }
    .multi-panel { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .topbar-brand { min-width: unset; font-size: 11px; }
    .nav-btn { padding: 10px 10px; font-size: 10px; }
  }
</style>
</head>
<body>

<div id="login" class="pantalla activa">
  <div class="login-card">
    <div class="login-header">
      <span class="java-icon">☕</span> Log in
    </div>
    <div class="login-body">
      <div class="login-bulb">💡</div>
      <div class="login-title">Iniciar Sesión</div>
      <div class="login-field" style="width:100%">
        <label>ID</label>
        <input type="text" id="inp-id" placeholder="Ingresa tu ID" autocomplete="off">
      </div>
      <div class="login-field" style="width:100%">
        <label>Contraseña</label>
        <input type="password" id="inp-pass" placeholder="••••••••">
      </div>
      <button class="btn-login" onclick="iniciarSesion()">Iniciar Sesión</button>
    </div>
  </div>
</div>

<div id="app" class="pantalla" style="display:none;">
  <!-- TOPBAR -->
  <div class="topbar" id="topbar">
    <div class="topbar-brand">CENTRO ECOLÓGICO<br>SEDE ARAGÓN</div>
    <div class="topbar-nav" id="topbar-nav"></div>
    <button class="nav-logout" onclick="cerrarSesion()">⏻ Salir</button>
  </div>

  <div class="contenido" id="contenido-principal"></div>
</div>

<div class="notif" id="notif"></div>
</body>
</html>
